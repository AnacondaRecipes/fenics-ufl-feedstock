{% set name = "fenics-ufl" %}
{% set version = "2026.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace("-", "_") }}-{{ version }}.tar.gz
  sha256: c83be6dcd4301f7e27b70cda076ada36e0bedabb9338d87a38fce44f3ab0f9ce

build:
  number: 0
  # upstream requires-python >=3.11
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.3
    - wheel
  run:
    - python
    - numpy

test:
  source_files:
    - test
    - demo
  imports:
    - ufl
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "import ufl; assert ufl.__version__ == '{{ version }}'"
    - python -m pytest -q test

about:
  home: https://fenicsproject.org
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file:
    - COPYING
    - COPYING.LESSER
  summary: Unified Form Language
  description: |
    The Unified Form Language (UFL) is a domain specific language
    for declaration of finite element discretizations of variational forms.
    More precisely, it defines a flexible interface for choosing finite element spaces
    and defining expressions for weak forms in a notation close to mathematical notation.

    UFL is part of the FEniCS Project.
  doc_url: https://docs.fenicsproject.org
  dev_url: https://github.com/fenics/ufl

extra:
  recipe-maintainers:
    - jorgensd
    - minrk
    - sblauth
